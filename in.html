<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্মার্ট পিডিএফ ডেটাবেস</title>
    <style>
        /* ডার্ক থিম স্টাইল */
        body {
            font-family: 'SolaimanLipi', Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 10px;
        }

        h2 {
            text-align: center;
            color: #4facfe;
            margin-bottom: 20px;
        }

        /* কন্ট্রোল প্যানেল (সার্চ এবং বাটন) */
        .controls {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            border: 1px solid #333;
        }

        /* রেডিও বাটন গ্রুপ */
        .filter-options {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            accent-color: #00f260; /* বাটনের রং */
        }

        .filter-options label {
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* সার্চ বক্স */
        input[type="text"] {
            width: 95%;
            padding: 12px;
            background-color: #2c2c2c;
            border: 2px solid #444;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            display: block;
            margin: 0 auto;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 8px rgba(79, 172, 254, 0.5);
        }

        /* টেবিল ডিজাইন */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #1e1e1e;
        }

        th, td {
            border: 1px solid #333;
            padding: 12px 8px;
            text-align: left;
        }

        th {
            background-color: #252525;
            color: #4facfe;
            font-weight: bold;
            position: sticky;
            top: 130px; /* সার্চ বক্সের নিচে ফিক্সড থাকবে */
        }

        tr:nth-child(even) {
            background-color: #2a2a2a;
        }

        tr:hover {
            background-color: #333;
        }

        /* লোডিং এবং স্ট্যাটাস */
        #status {
            text-align: center;
            margin-top: 20px;
            color: #ff9800;
        }

        .highlight {
            background-color: #00f260;
            color: black;
            font-weight: bold;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <h2>স্মার্ট পিডিএফ ডেটাবেস</h2>

    <div class="controls">
        <div class="filter-options">
            <label><input type="radio" name="searchType" value="name" checked> নাম</label>
            <label><input type="radio" name="searchType" value="father"> পিতার নাম</label>
            <label><input type="radio" name="searchType" value="serial"> ক্রমিক নং</label>
        </div>

        <input type="text" id="searchBox" placeholder="এখানে নাম লিখে খুঁজুন..." onkeyup="filterTable()">
    </div>

    <p id="status">সিস্টেম লোড হচ্ছে...</p>

    <table id="dataTable" style="display:none;">
        <thead>
            <tr>
                <th width="15%">ক্রমিক</th>
                <th width="40%">নাম</th>
                <th width="45%">পিতার নাম / অন্যান্য</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <script src="pdf.min.js"></script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

        // গ্লোবাল ভেরিয়েবল ডাটা রাখার জন্য
        let allRowsData = [];

        // পেজ লোড হওয়ার সাথে সাথে এই ফাংশন কল হবে
        window.onload = function() {
            loadAutoPDF();
        };

        async function loadAutoPDF() {
            const url = 'data.pdf'; // আপনার পিডিএফ ফাইলের নাম অবশ্যই 'data.pdf' হতে হবে
            const status = document.getElementById('status');

            try {
                status.innerText = "পিডিএফ ফাইল লোড হচ্ছে... (অনুগ্রহ করে অপেক্ষা করুন)";
                
                const loadingTask = pdfjsLib.getDocument(url);
                const pdf = await loadingTask.promise;
                
                status.innerText = `মোট ${pdf.numPages} টি পৃষ্ঠা প্রসেস করা হচ্ছে...`;

                let extractedRows = [];

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    
                    // পিডিএফ এর টেক্সটগুলোকে Y পজিশন অনুযায়ী সাজানো (যাতে লাইন ঠিক থাকে)
                    // এটি এলোমেলো টেক্সটকে একটি লাইনে নিয়ে আসবে
                    const items = textContent.items;
                    
                    // একটি নির্দিষ্ট লাইনের আইটেম গ্রুপিং করার লজিক
                    let lineGroups = {};
                    
                    items.forEach(item => {
                        // Y পজিশন একটু এদিক সেদিক হতে পারে, তাই রাউন্ড করা হলো
                        let y = Math.round(item.transform[5]); 
                        if (!lineGroups[y]) lineGroups[y] = [];
                        lineGroups[y].push(item.str);
                    });

                    // অবজেক্ট থেকে অ্যারেতে কনভার্ট এবং উল্টো দিক থেকে সাজানো (পিডিএফ নিচ থেকে উপরে রিড করে মাঝে মাঝে)
                    let sortedY = Object.keys(lineGroups).sort((a, b) => b - a);
                    
                    sortedY.forEach(y => {
                        let lineTextArray = lineGroups[y];
                        // এখানে আমরা ধরে নিচ্ছি একটি লাইনে ৩টি অংশ থাকে: ক্রমিক, নাম, পিতা
                        // আপনার পিডিএফ এর ফরম্যাট অনুযায়ী এটি কাজ করবে
                        
                        let fullLineString = lineTextArray.join("  |  "); // ডিবাগিং এর জন্য জয়েন
                        
                        // ডাটা অবজেক্ট তৈরি (অনুমান নির্ভর কলাম)
                        // সাধারণত ১ম অংশ ক্রমিক, ২য় অংশ নাম হয়
                        let rowObj = {
                            raw: lineTextArray, // মূল ডাটা
                            fullText: lineTextArray.join(" ").toLowerCase() // সার্চের জন্য
                        };
                        extractedRows.push(rowObj);
                    });
                }

                allRowsData = extractedRows;
                populateTable(extractedRows);
                status.style.display = 'none'; // লোডিং মেসেজ লুকানো
                document.getElementById('dataTable').style.display = 'table';

            } catch (error) {
                console.error(error);
                status.innerHTML = `<span style="color:red">ফাইল লোড হয়নি!</span><br>নিশ্চিত করুন ফাইলের নাম 'data.pdf' এবং আপনি 'Local Server' ব্যবহার করছেন।`;
            }
        }

        // টেবিলে ডাটা দেখানোর ফাংশন
        function populateTable(data) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = "";

            if(data.length === 0) return;

            data.forEach(row => {
                // আমরা চেষ্টা করবো অ্যারে থেকে সঠিক কলাম বের করতে
                // যদি অ্যারেতে ১টা আইটেম থাকে, সেটা নাম হিসেবে দেখাবে
                let serial = row.raw[0] || ""; 
                let name = row.raw[1] || row.raw[0] || ""; 
                let father = row.raw.slice(2).join(" ") || ""; // বাকি সব টেক্সট ৩য় কলামে

                // যদি পিডিএফ এ ক্রমিক সংখ্যা না থাকে, তবে অটো জেনারেট হবে না, পিডিএফ এর টেক্সটই দেখাবে
                // ভালো দেখার জন্য লজিক:
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${serial}</td>
                    <td class="name-col">${name}</td>
                    <td class="father-col">${father}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // সার্চ এবং ফিল্টার ফাংশন
        function filterTable() {
            const searchBox = document.getElementById('searchBox');
            const filterText = searchBox.value.toLowerCase();
            const searchType = document.querySelector('input[name="searchType"]:checked').value;
            
            const table = document.getElementById('dataTable');
            const tr = table.getElementsByTagName('tr');

            // ১ নম্বর সারি (হেডার) বাদে বাকিগুলো লুপ হবে
            for (let i = 1; i < tr.length; i++) {
                let row = tr[i];
                let cells = row.getElementsByTagName('td');
                
                let textToSearch = "";

                // রেডিও বাটন অনুযায়ী কলাম সিলেক্ট করা
                if (searchType === 'serial') {
                    textToSearch = cells[0].textContent || "";
                } else if (searchType === 'name') {
                    textToSearch = cells[1].textContent || "";
                } else if (searchType === 'father') {
                    textToSearch = cells[2].textContent || "";
                }

                // সার্চ লজিক
                if (textToSearch.toLowerCase().indexOf(filterText) > -1) {
                    row.style.display = "";
                    // অক্ষর হাইলাইট করার অপশন (ইচ্ছে করলে রাখা যায়)
                    // cells[1].style.color = "#4facfe"; 
                } else {
                    row.style.display = "none";
                }
            }
        }
        
        // রেডিও বাটন চেঞ্জ করলে সার্চ বক্সের প্লেসহোল্ডার চেঞ্জ হবে
        document.querySelectorAll('input[name="searchType"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const map = {
                    'name': 'এখানে নাম লিখে খুঁজুন...',
                    'father': 'পিতার নাম লিখে খুঁজুন...',
                    'serial': 'ক্রমিক নম্বর লিখুন...'
                };
                document.getElementById('searchBox').placeholder = map[e.target.value];
                filterTable(); // টাইপ বদলানোর সাথে সাথে আবার ফিল্টার করবে
            });
        });

    </script>
</body>
</html>
